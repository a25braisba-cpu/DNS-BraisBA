services:


  darthvader:
    build: dnsserver
    hostname: darthvader
    command: -g -4
    volumes:
      # - ./darthvader/named.conf.options:/etc/bind/named.conf.options
      - ./darthvader/named.conf.local:/etc/bind/named.conf.local
      - ./darthvader/zonas/db.starwars.lan:/etc/bind/zonas/db.starwars.lan
      - ./darthvader/zonas/db.192.168.20:/etc/bind/zonas/db.192.168.20
    networks:
      rededns:
        ipv4_address: 192.168.20.10

  mandalorian:
    build: dnsserver
    hostname: mandalorian
    command: -g -4
    volumes:
      - ./mandalorian/named.conf.options:/etc/bind/named.conf.options
    networks:
      rededns:
        ipv4_address: 192.168.20.8    
      
  cliente:
    build: cliente
    hostname: cliente1
    networks:
      rededns:
        ipv4_address: 192.168.20.110
    volumes:
      - ./cliente/rndc.conf:/etc/bind/rndc.conf
      - ./cliente/chave.key:/etc/bind/chave.key
      - ./cliente/actualiza.txt:/etc/bind/actualiza.txt
    dns: 
    - 192.168.20.10
    - 192.168.20.11

networks:
  rededns:
    ipam:
      config:
        - subnet: 192.168.20.0/24